<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing - page</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <section id="contacto">
        <div class="formulario-contenedor">
            <form class="formulario-contacto">
                <h2>Contáctanos</h2>

                <div class="grupo-formulario">
                    <input type="text" id="nombre" name="nombre" required>
                    <label for="nombre">Nombre</label>
                    <span class="borde-focus"></span>
                </div>

                <div class="grupo-formulario">
                    <input type="email" id="email" name="email" required>
                    <label for="email">Email</label>
                    <span class="borde-focus"></span>
                </div>

                <div class="grupo-formulario">
                    <textarea id="mensaje" name="mensaje" rows="4" required></textarea>
                    <label for="mensaje">Mensaje</label>
                    <span class="borde-focus"></span>
                </div>

                <button class="boton-enviar" type="submit">
                    <span class="btn-texto">Enviar</span>
                    <span class="btn-icon"><i class="fa-solid fa-paper-plane"></i></span>
                </button>
            </form>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2026 Brayan - Nicole - Joshan - Oliver. Todos los derechos reservados.</p>
    </footer>
</body>

</html>
